# Companion and its Docker socket proxy in one container, from the published image. Set SECRET_KEY in
# .env, then run:
# docker compose -f docker-compose.all-in-one.yml up -d

services:
  companion:
    image: ghcr.io/lewlew-glitch/qm-companion-all-in-one:${QM_COMPANION_TAG:-latest}
    container_name: qm-companion
    labels:
      # Excludes this container from panel controls.
      qm.protected: "true"
    # Restrict writes to the data volume and drop Linux capabilities. The proxy runs as root and
    # Companion as the node user; SETUID and SETGID are only what the switch between them needs.
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /run:size=1m,mode=0755
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # Bind the NAS's LAN address explicitly so Docker does not publish the panel on every interface.
      # Use 127.0.0.1 here instead when only a same-host reverse proxy should reach Companion.
      - "192.168.1.10:8787:8787"
    environment:
      # Store this in the gitignored .env file:
      #   umask 077; printf 'SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY is required (64 hexadecimal characters; set it in .env).}"
      # Optional first-run bootstrap token.
      # SETUP_TOKEN: "PUT_A_DIFFERENT_64_HEX_TOKEN_HERE"
      # Address used by the browser and phone.
      QM_HOST: "192.168.1.10"
      # Optional pairing preset.
      # QM_REMOTE_HOST: "nas.your-tailnet.ts.net"
      # Listen on the container network.
      BIND_ADDRESS: "0.0.0.0"
      # Optional host roots allowed for Marketplace bind mounts. Empty permits named volumes only.
      #   DOCKER_DEPLOY_BIND_ROOTS: "/volume1/docker"
      # Optional address for ports published by Marketplace deployments.
      #   DOCKER_DEPLOY_BIND_ADDRESS: "192.168.1.10"
      # Installed Docker access limit: read, manage or shell. The proxy inside follows it, so there is
      # no overlay file to add. Recreate the container after changing it.
      DOCKER_ACCESS_MAX: "read"
      # Optional loopback port for the proxy inside. Change it only if 2375 is taken with network_mode: host.
      #   PROXY_PORT: "2375"
      # Legacy v1 state only: enable for one migration boot, confirm v2, then remove permanently.
      # MIGRATE_V1_STATE: "true"
    volumes:
      # Only the proxy inside can open the socket. Companion runs as a user that cannot.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount individual service config files read-only.
      - /volume1/docker/radarr/config.xml:/stack/radarr/config.xml:ro
      - /volume1/docker/sonarr/config.xml:/stack/sonarr/config.xml:ro
      - /volume1/docker/lidarr/config.xml:/stack/lidarr/config.xml:ro
      - /volume1/docker/prowlarr/config.xml:/stack/prowlarr/config.xml:ro
      # Uncomment only the services and host paths that exist on your server.
      # - /volume1/docker/bazarr/config/config.yaml:/stack/bazarr/config.yaml:ro
      # - /volume1/docker/sabnzbd/sabnzbd.ini:/stack/sabnzbd/sabnzbd.ini:ro
      # - /volume1/docker/jellyseerr/settings.json:/stack/jellyseerr/settings.json:ro
      # - /volume1/docker/overseerr/settings.json:/stack/overseerr/settings.json:ro
      # Encrypted application state.
      - qm-data:/data
    restart: unless-stopped

volumes:
  qm-data:
